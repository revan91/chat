<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>贊助我們 - 有聊 havetalk</title>
    <!-- 引入 Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入贊助頁專用 CSS -->
    <link rel="stylesheet" href="donate.css">
</head>

<body>

    <!-- 1. 漢堡按鈕 (開關選單用) -->
    <button class="toggle-btn" id="toggleBtn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <!-- 2. 遮罩層 (點擊選單外部可關閉) -->
    <div class="overlay" id="overlay"></div>

    <!-- 3. 側邊選單主體 -->
    <div class="sidebar" id="sidebar">
        <!-- 上方 Logo 區域 -->
        <div class="logo-container">
            <div class="logo-box">
                <span class="logo-text">H</span>
            </div>
        </div>

        <!-- 第一區塊：主要選單 -->
        <ul class="menu-list">
            <li><a href="#"><i class="fa-regular fa-comment-dots icon"></i>空</a></li>
            <li><a href="#"><i class="fa-regular fa-question-circle icon"></i>使用說明</a></li>
            <li><a href="#"><i class="fa-solid fa-star icon"></i>聯絡我們</a></li>
        </ul>

        <!-- 第二區塊：捷徑 -->
        <div class="menu-category">快速通道</div>
        <ul class="menu-list">
            <li><a href="donate.html"><i class="fa-solid fa-right-from-bracket icon"></i>贊助我們</a></li>
            <li><a href="#"><i class="fa-solid fa-magnifying-glass icon"></i>約會景點推薦</a></li>
        </ul>

        <!-- 第三區塊：設定 -->
        <div class="menu-category">設定</div>
        <ul class="menu-list">
            <li class="toggle-item">
                <div class="item-left">
                    <i class="fa-solid fa-volume-high icon"></i>新訊息音效提醒
                </div>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </li>
        </ul>
    </div>

    <!-- 4. 畫面中央的贊助區域 -->
    <main class="donate-container">
        <div class="donate-card">
            <div class="donate-header">
                <i class="fa-solid fa-mug-hot donate-icon"></i>
                <h2>贊助「有聊」團隊</h2>
                <p>感謝您的支持！您的贊助能讓伺服器維修與開發團隊持續運作。</p>
            </div>

            <!-- 收款 QR Code 容器 -->
            <div class="qrcode-wrapper">
                <!-- 👈 請將 src 換成你的收款碼圖片路徑 (例如: images/qrcode.png) -->
                <img src="donate.jpg" alt="收款碼 QR Code" class="qrcode-img">
            </div>

            <!-- 轉帳/帳號備用區（點擊可複製） -->
            <div class="account-info">
                <p class="account-title">轉帳帳戶 (銀行代碼 396)</p>
                <div class="account-box">
                    <span id="accountNumber">908098930</span>
                    <button id="copyBtn" class="copy-btn">
                        <i class="fa-regular fa-copy"></i> 複製
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="donate.js"></script>
</body>

</html>
