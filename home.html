<!-- Home.html -->
<!DOCTYPE html>
<html lang="zh-TW">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>吾聊 - 進入頁面</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background-color: #1e1e1e;
                /* 依據圖片的暗色背景 */
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                color: white;
            }

            .container {
                width: 100%;
                max-width: 360px;
                padding: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 30px;
            }

            /* 暱稱輸入框 */
            .nickname-input {
                width: 100%;
                padding: 15px;
                border-radius: 4px;
                border: none;
                background-color: #dcdcdc;
                font-size: 1.2rem;
                text-align: center;
                color: #333;
                outline: none;
            }

            .nickname-input::placeholder {
                color: #888;
            }

            /* 性別選擇區域 */
            .gender-group {
                display: flex;
                justify-content: center;
                gap: 40px;
                width: 100%;
            }

            .gender-btn {
                width: 80px;
                height: 80px;
                background-color: white;
                border-radius: 4px;
                display: flex;
                justify-content: center;
                align-items: center;
                cursor: pointer;
                border: 3px solid transparent;
                transition: all 0.2s ease;
                user-select: none;
            }

            /* 圖標 SVG 樣式 */
            .gender-btn svg {
                width: 48px;
                height: 48px;
            }

            /* 被選中的按鈕特效 */
            .gender-btn.selected {
                border-color: #00b050;
                /* 綠色高亮邊框 */
                box-shadow: 0 0 12px rgba(0, 176, 80, 0.5);
                transform: scale(1.05);
            }

            /* 開始配對按鈕 */
            .start-btn {
                width: 100%;
                padding: 15px;
                background-color: #00b050;
                /* 圖片中的鮮豔綠色 */
                color: white;
                font-size: 1.3rem;
                font-weight: bold;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                transition: background 0.2s;
            }

            .start-btn:hover {
                background-color: #009343;
            }
        </style>
    </head>

    <body>

        <div class="container">
            <!-- 暱稱輸入框 -->
            <input type="text" id="nickname" class="nickname-input" placeholder="暱稱" maxlength="10"
                autocomplete="off" />

            <!-- 性別選擇按鈕 -->
            <div class="gender-group">
                <!-- 男 (Blue) -->
                <div class="gender-btn" id="btn-male" data-gender="male">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#0095f6" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="10" cy="14" r="5"></circle>
                        <line x1="19" y1="5" x2="13.6" y2="10.4"></line>
                        <polyline points="14 5 19 5 19 10"></polyline>
                    </svg>
                </div>

                <!-- 女 (Pink) -->
                <div class="gender-btn" id="btn-female" data-gender="female">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#ff5a92" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="9" r="5"></circle>
                        <line x1="12" y1="14" x2="12" y2="21"></line>
                        <line x1="9" y1="18" x2="15" y2="18"></line>
                    </svg>
                </div>
            </div>

            <!-- 開始配對按鈕 -->
            <button id="start-match-btn" class="start-btn">開始配對</button>
        </div>

        <script>
            let selectedGender = null;

            const btnMale = document.getElementById('btn-male');
            const btnFemale = document.getElementById('btn-female');
            const nicknameInput = document.getElementById('nickname');
            const startBtn = document.getElementById('start-match-btn');

            // 單選性別按鈕邏輯
            btnMale.addEventListener('click', () => {
                selectedGender = 'male';
                btnMale.classList.add('selected');
                btnFemale.classList.remove('selected');
            });

            btnFemale.addEventListener('click', () => {
                selectedGender = 'female';
                btnFemale.classList.add('selected');
                btnMale.classList.remove('selected');
            });

            // 點擊開始配對
            startBtn.addEventListener('click', () => {
                const nickname = nicknameInput.value.trim();

                // 驗證 1：是否填寫暱稱
                if (!nickname) {
                    alert('請輸入暱稱！');
                    nicknameInput.focus();
                    return;
                }

                // 驗證 2：是否選擇性別
                if (!selectedGender) {
                    alert('請選擇您的性別！');
                    return;
                }

                // 將資料暫存到瀏覽器的 localStorage
                localStorage.setItem('userNickname', nickname);
                localStorage.setItem('userGender', selectedGender);

                // 跳轉至聊天配對主頁面，並帶上自動開始配對的標記
                window.location.href = 'index.html?autoStart=true';
            });
        </script>
    </body>

</html>
