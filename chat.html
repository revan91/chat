<!DOCTYPE html>
<html lang="zh-TW">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>有聊 havetalk</title>
    <!-- Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style_chat.css">
  </head>

  <body>
    <!-- 1. 漢堡按鈕 (開關選單用) -->
    <button class="toggle-btn" id="toggleBtn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <!-- 2. 遮罩層 -->
    <div class="overlay" id="overlay"></div>

    <!-- 3. 側邊選單主體 -->
    <div class="sidebar" id="sidebar">
        <!-- 上方 Logo 區域 -->
        <div class="logo-container">
            <div class="logo-box">
                <span class="logo-text">H</span>
            </div>
        </div>

        <!-- 第一區塊：主要選單 -->
        <ul class="menu-list">
            <li><a href="rule.html"><i class="fa-regular fa-question-circle icon"></i>使用者規章</a></li>
            <li><a href="https://www.threads.com/@coding_91"><i class="fa-solid fa-star icon"></i>聯絡我們</a></li>
        </ul>

        <!-- 第二區塊：捷徑 -->
        <div class="menu-category">快速通道</div>
        <ul class="menu-list">
            <li><a href="donate.html"><i class="fa-solid fa-right-from-bracket icon"></i>贊助我們</a></li>
            <li><a href="#"><i class="fa-solid fa-magnifying-glass icon"></i>約會景點推薦</a></li>
        </ul>

        <!-- 第三區塊：設定 -->
        <div class="menu-category">設定</div>
        <ul class="menu-list">
            <li class="toggle-item">
                <div class="item-left">
                    <i class="fa-solid fa-volume-high icon"></i>新訊息音效提醒
                </div>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </li>
        </ul>
    </div>

    <!-- 主內容區塊 -->
    <div id="main-content">
      <div id="setup-card" class="setup-card">
        <input type="text" id="secret-key" class="secret-input" placeholder="暗號 (選填)" autocomplete="off" />
        <button id="start-match-btn" class="start-btn">開始配對</button>
      </div>
      <div id="chat-box"></div>
    </div>

    <!-- 輸入區域：新增「離開按鈕」於左側/右側 -->
    <form id="input-area">
      <button type="button" id="leave-btn" class="btn-leave">離開</button>
      <input type="text" id="message-input" placeholder="請先開始配對..." autocomplete="off" disabled required />
      <button type="submit" id="send-btn" disabled>傳送</button>
    </form>

    <!-- 離場確認彈窗 Modal -->
    <div id="leave-modal" class="modal-overlay">
      <div class="modal-card">
        <button id="modal-close-btn" class="btn-modal-cancel">&times;</button>
        <div id="modal-title" class="modal-title">是否確定離開？</div>
        <input type="text" id="leave-verify-input" class="modal-input" placeholder="請輸入 Leave" style="display: none;" autocomplete="off" />
        <div class="modal-actions">
          <button id="report-btn" class="btn-report">檢舉/回報</button>
          <button id="confirm-leave-btn" class="btn-modal-leave">離開</button>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="chat.js"></script>
  </body>

</html>
