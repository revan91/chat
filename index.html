<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>有聊 havetalk</title>
    <!-- 引入 Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 外部 CSS 檔案 -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 1. 漢堡按鈕 (開關選單用) -->
    <button class="toggle-btn" id="toggleBtn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <!-- 2. 遮罩層 (點擊選單外部可關閉) -->
    <div class="overlay" id="overlay"></div>

    <!-- 3. 側邊選單主體 -->
    <div class="sidebar" id="sidebar">
        <!-- 上方 Logo 區域 -->
        <div class="logo-container">
            <div class="logo-box">
                <span class="logo-text">H</span>
            </div>
        </div>

        <!-- 第一區塊：主要選單 -->
        <ul class="menu-list">
            <li><a href="rule.html"><i class="fa-regular fa-question-circle icon"></i>使用者規章</a></li>
            <li><a href="https://www.threads.com/@coding_91"><i class="fa-solid fa-star icon"></i>聯絡我們</a></li>
        </ul>

        <!-- 第二區塊：捷徑 -->
        <div class="menu-category">快速通道</div>
        <ul class="menu-list">
            <li><a href="donate.html"><i class="fa-solid fa-right-from-bracket icon"></i>贊助我們</a></li>
            <li><a href="#"><i class="fa-solid fa-magnifying-glass icon"></i>約會景點推薦</a></li>
        </ul>

        <!-- 第三區塊：設定 -->
        <div class="menu-category">設定</div>
        <ul class="menu-list">
            <li class="toggle-item">
                <div class="item-left">
                    <i class="fa-solid fa-volume-high icon"></i>新訊息音效提醒
                </div>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </li>
        </ul>
    </div>

    <!-- 4. 主內容區域 (性別與暱稱輸入) -->
    <div class="container">
        <!-- 性別選擇按鈕 -->
        <div class="gender-group">
            <!-- 男 (Blue) -->
            <div class="gender-btn" id="btn-male" data-gender="male">
                <svg viewBox="0 0 24 24" fill="none" stroke="#0095f6" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="10" cy="14" r="5"></circle>
                    <line x1="19" y1="5" x2="13.6" y2="10.4"></line>
                    <polyline points="14 5 19 5 19 10"></polyline>
                </svg>
            </div>

            <!-- 女 (Pink) -->
            <div class="gender-btn" id="btn-female" data-gender="female">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ff5a92" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="12" cy="9" r="5"></circle>
                    <line x1="12" y1="14" x2="12" y2="21"></line>
                    <line x1="9" y1="18" x2="15" y2="18"></line>
                </svg>
            </div>
        </div>

        <!-- 暱稱輸入框 -->
        <input type="text" id="nickname" class="nickname-input" placeholder="暱稱" maxlength="10" autocomplete="off" />

        <!-- 進入配對頁面按鈕 -->
        <button id="next-btn" class="next-btn">下一步</button>
    </div>

    <!-- 外部 JS 檔案 -->
    <script src="index.js"></script>
</body>

</html>
