<!-- index.html -->
<!DOCTYPE html>
<html lang="zh-TW">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WooTalk Clone - 密語匿名配對</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: sans-serif;
        background: #f0f2f5;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      header {
        background: #3b5998;
        color: white;
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      header h1 {
        font-size: 1.2rem;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .secret-input {
        padding: 8px 12px;
        border-radius: 20px;
        border: 1px solid #ddd;
        outline: none;
        font-size: 0.9rem;
        width: 140px;
      }

      .btn {
        padding: 8px 16px;
        border-radius: 20px;
        border: none;
        font-weight: bold;
        cursor: pointer;
        font-size: 0.9rem;
      }

      .btn-action {
        background: #42b72a;
        color: white;
      }

      .btn-danger {
        background: #fa3e3e;
        color: white;
      }

      .btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      #chat-box {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .system-msg {
        align-self: center;
        background: #e1e3e8;
        color: #555;
        padding: 6px 14px;
        border-radius: 10px;
        font-size: 0.85rem;
        margin: 5px 0;
      }

      .message {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 12px;
        word-wrap: break-word;
        font-size: 0.95rem;
      }

      .my-message {
        align-self: flex-end;
        background: #0084ff;
        color: white;
      }

      .other-message {
        align-self: flex-start;
        background: #e4e6eb;
        color: #050505;
      }

      #input-area {
        display: flex;
        padding: 10px;
        background: white;
        border-top: 1px solid #ddd;
      }

      #message-input {
        flex: 1;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 20px;
        outline: none;
        font-size: 1rem;
      }

      #send-btn {
        margin-left: 10px;
        padding: 0 20px;
        background: #0084ff;
        color: white;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
      }

      #send-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
    </style>
  </head>

  <body>

    <header>
      <h1>吾聊 Clone</h1>
      <div class="controls">
        <input type="text" id="secret-key" class="secret-input" placeholder="暗號 (選填)" autocomplete="off" />
        <button id="match-btn" class="btn btn-action">開始配對</button>
        <button id="leave-btn" class="btn btn-danger" style="display: none;">離開 / 下一位</button>
      </div>
    </header>

    <div id="chat-box">
      <div class="system-msg">輸入密語或留空，點擊右上方「開始配對」尋找對象。</div>
    </div>

    <form id="input-area">
      <input type="text" id="message-input" placeholder="請先開始配對..." autocomplete="off" disabled required />
      <button type="submit" id="send-btn" disabled>傳送</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      const matchBtn = document.getElementById('match-btn');
      const leaveBtn = document.getElementById('leave-btn');
      const secretInput = document.getElementById('secret-key');
      const form = document.getElementById('input-area');
      const input = document.getElementById('message-input');
      const sendBtn = document.getElementById('send-btn');
      const chatBox = document.getElementById('chat-box');

      let inRoom = false;

      // 1. 開始配對
      matchBtn.addEventListener('click', () => {
        chatBox.innerHTML = '';
        const secretKey = secretInput.value;
        socket.emit('start match', secretKey);

        matchBtn.disabled = true;
        secretInput.disabled = true;
        appendSystemMsg('尋找對象中，請稍候...');
      });

      // 2. 離開房間
      leaveBtn.addEventListener('click', () => {
        socket.emit('leave room');
        setChatState(false);
        appendSystemMsg('您已離開聊天室。請點擊「開始配對」重新尋找。');
      });

      // 3. 系統狀態訊息
      socket.on('status', (msg) => {
        appendSystemMsg(msg);
      });

      // 4. 配對成功
      socket.on('matched', (data) => {
        setChatState(true);
        const secretNotice = data.secretKey !== 'default' ? `（暗號：${data.secretKey}）` : '';
        appendSystemMsg(`🎉 配對成功${secretNotice}！連線成功，可以開始聊天了！`);
      });

      // 5. 對方離開
      socket.on('partner left', () => {
        setChatState(false);
        appendSystemMsg('❌ 陌生人已離開聊天室。');
      });

      // 6. 傳訊
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (input.value.trim() && inRoom) {
          socket.emit('chat message', input.value);
          input.value = '';
        }
      });

      // 7. 接收訊息
      socket.on('chat message', (data) => {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message');

        if (data.senderId === socket.id) {
          msgDiv.classList.add('my-message');
          msgDiv.textContent = data.text;
        } else {
          msgDiv.classList.add('other-message');
          msgDiv.textContent = data.text;
        }

        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      function setChatState(active) {
        inRoom = active;
        input.disabled = !active;
        sendBtn.disabled = !active;

        if (active) {
          input.placeholder = "輸入訊息...";
          matchBtn.style.display = 'none';
          secretInput.style.display = 'none';
          leaveBtn.style.display = 'inline-block';
        } else {
          input.placeholder = "請先開始配對...";
          matchBtn.style.display = 'inline-block';
          secretInput.style.display = 'inline-block';
          matchBtn.disabled = false;
          secretInput.disabled = false;
          leaveBtn.style.display = 'none';
        }
      }

      function appendSystemMsg(text) {
        const sysDiv = document.createElement('div');
        sysDiv.classList.add('system-msg');
        sysDiv.textContent = text;
        chatBox.appendChild(sysDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    </script>
  </body>

</html>
